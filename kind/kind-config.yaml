# kind cluster definition for the lab.
#
# 3 nodes: one control-plane + two workers. Multi-node is the whole reason kind was
# chosen over a single-node setup — it lets you watch the scheduler place pods on
# different machines, and it makes Kafka's replication across brokers meaningful.
#
# extraPortMappings forward a port from the host (your Mac) into the control-plane
# container. Without them, a NodePort Service would be reachable from inside the
# cluster network but not from your laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
  - role: worker
  - role: worker
